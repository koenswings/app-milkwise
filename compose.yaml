x-app:
  name: milkwise
  title: MilkWise
  description: >
    MilkWise is a precision bottle-feeding tracker for parents of formula-fed
    and combination-fed infants. It calculates personalised daily targets based
    on the baby's weight and tracks intake using a Smoothed Effective formula
    that gives partial credit to older feeds — providing a more accurate and
    stable picture of daily nutrition than a simple 24h window.

    Features: feed logging, Smoothed Effective + Strict 24h dashboards, analytics,
    history with edit/delete, CSV export, and CSV import for historic data.
  url: https://github.com/koenswings/app-milkwise
  category: health
  icon: icon.png
  author: Koen Swings
  version: "1.1"
  instanceName: milkwise
  # updateApp (idea#351, agent-app-dev#23). healthTimeout: integer seconds.
  # No migration measured: default 600 s.
  healthCheck:
    path: /api/settings
  healthTimeout: 600
  updatesFrom: []
  migrationNote: MilkWise keeps all logged feeds and weights.
  snapshotExclude: []
  # Engine backup (idea#375 item 9, idea#444). MilkWise 1.1.57+ writes every JSON
  # store with write-temp + fsync + rename (src/lib/atomic-write.ts) and appends the
  # settings history JSONL with fsync, so a live borg copy of ./data is consistent
  # without stopping the app. The hooks are deliberate no-ops: `method: hook` is the
  # Engine's only no-stop method ('live'/'none' are refused, backupMethod.ts:121).
  # No exclude: .env stays in the archive (accepted Engine limit, Koen via Steve);
  # leftover .<file>.<pid>.<ts>.tmp files are harmless and need no exclude.
  backup:
    method: hook
    fallback: stop        # only if `docker compose exec` itself fails; a stopped instance is never stopped again
    hookTimeout: 30
    preHook:
      service: milkwise
      command: ["true"]
    postHook:
      service: milkwise
      command: ["true"]

services:
  milkwise:
    # Image built from koenswings/baby-milk-tracker 715734b (web 1.1.58) by
    # scripts/build-image.sh on an arm64 Pi; not on any registry (pull_policy: never).
    # The ./app folder is an older vendored copy (1.0.x) and is NOT the 1.1.58 source.
    image: koenswings/milkwise:1.1.58
    labels:
      x-app-version: "1.1"
    init: true
    restart: unless-stopped
    pull_policy: never
    ports:
      - "${port:-3333}:3333"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3333
      # Must equal the container side of the ./data bind above. 1.1.58 logs
      # "[milkwise] DATA_DIR resolved to /app/data" at startup.
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3333/api/settings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
